[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "flyff-bot"
version = "0.1.0"
description = "Windows-first automation tooling for an explicitly permitted Flyff client."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "numpy>=2.5.2",
  "opencv-python>=5.0.0.93",
  "pyarrow>=20.0.0",
  "PySide6>=6.10,<6.11",
  "pyyaml>=6.0.3",
]

[project.scripts]
flyff-bot = "flyff_bot.cli:main"

[project.optional-dependencies]
training = [
    "ultralytics>=8.4.120",
]
# Offline farming-value model export (US-066). Only the developer-side ONNX writer needs it;
# live inference reads the artifacts through the OpenCV DNN runtime that ships with the app.
ml = [
    "onnx>=1.22,<2",
]
# Offline reinforcement-learning training (BUG-030). Only the developer-side simulator
# environment and its framework-level conformance check import it; the live application
# never does, so the running bot keeps no reinforcement-learning runtime dependency.
rl = [
    "gymnasium>=1.0,<2",
]

[dependency-groups]
dev = [
  "capstone>=5.0",
  "gymnasium>=1.0,<2",
  "mypy>=1.17",
  "onnx>=1.22,<2",
  "pytest>=8.4",
  "pytest-cov>=6.2",
  "ruff>=0.12",
  "types-PyYAML>=6.0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flyff_bot"]

[tool.mypy]
python_version = "3.14"
platform = "win32"
strict = true
# `scripts/` holds the developer calibration harnesses. They are not shipped, but their
# pure manifest and fitting logic is unit tested, so they are typed like everything else.
files = ["src", "tests", "scripts"]
mypy_path = "scripts"

[[tool.mypy.overrides]]
module = ["cv2", "onnx", "onnx.*", "pyarrow", "pyarrow.*", "ultralytics"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=flyff_bot --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201"]
